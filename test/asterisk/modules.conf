; modules.conf for the app_amd_ws test harness.
; autoload=no: only the modules the dialplan needs.  No chan_sip/pjsip, no
; manager, no HTTP server => no network listeners; the only socket the test
; Asterisk opens is the CLI control socket under astrundir.
; The Local channel driver is part of the core in Asterisk 16 (main/core_local.c),
; so it needs no "load" line.
[modules]
autoload = no

; dialplan + timing
load => pbx_config.so
load => res_timing_timerfd.so
load => res_clioriginate.so        ; "channel originate" CLI command

; the WebSocket client the module under test uses
load => res_http_websocket.so

; applications used by farside/amdside
load => app_playback.so
load => app_system.so
load => app_verbose.so
load => app_echo.so
load => app_mixmonitor.so
load => app_record.so
load => app_dial.so
load => app_originate.so
load => app_stack.so               ; Gosub/Return
load => app_exec.so                ; ExecIf

; file formats (generated sounds are 8 kHz 16-bit wav; sln for raw captures)
load => format_sln.so
load => format_wav.so
load => format_pcm.so

; codecs (Local channels here are slin end to end; kept for completeness)
load => codec_ulaw.so
load => codec_alaw.so
load => codec_resample.so

; dialplan functions
load => func_strings.so            ; STRFTIME, FILTER, LEN, QUOTE ...
load => func_base64.so             ; shell-safe AMDRESPONSE in results.txt
load => func_logic.so              ; IF
load => func_env.so                ; FILE, ENV, STAT
load => func_cut.so
load => func_channel.so
load => func_callerid.so
load => func_global.so
load => func_math.so

; the module under test is added by run.sh with an explicit load line
; (see modules.conf.amd in the rendered etc dir) so that the harness can
; also run without it (--selftest).
#include modules.conf.amd
