; logger.conf for the app_amd_ws test harness.
; "full" receives everything incl. verbose (level 3 from asterisk.conf) and
; debug 1, so run.sh can grep the per-call AMD_WS lines:
;   AMD_WS: <chan> vid=<vid> host=<h>:<p> play=<file|none>
;   AMD_WS: <chan> status=<S> cause=<C> elapsed=<ms> sent=<bytes> chunks=<n>
[general]
dateformat = %F %T.%3q
appendhostname = no
queue_log = no
event_log = no
use_callids = yes

[logfiles]
full => notice,warning,error,debug,verbose,dtmf
messages => notice,warning,error
